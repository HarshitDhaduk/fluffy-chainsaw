name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (offline walking skeleton + self-healing scenarios)
        run: pytest -q
        env:
          LALFITA_OFFLINE: "1"
      - name: Self-healing evals
        run: python -m evals.runner
        env:
          LALFITA_OFFLINE: "1"
      - name: Durability (real process kill)
        run: pytest -q -m durable tests/test_durability.py
        env:
          LALFITA_OFFLINE: "1"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/evals/report/
