steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE=${_API_BASE}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _API_BASE: http://localhost:8080
  _IMAGE: lalfita-dashboard
options:
  logging: CLOUD_LOGGING_ONLY
